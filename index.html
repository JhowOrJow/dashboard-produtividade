                            <label class="form-label small text-uppercase">Setor</label>
                            <select id="filterSetor" class="form-select form-select-sm">
                                <option value="todos">Todos os Setores</option>
                            </select>
                        </div>
                        <div class="col-4 col-md-2">
                            <button id="btnFiltrar" class="btn btn-info btn-sm w-100 fw-bold">OK</button>
                        </div>
                    </div>
                </div>
            </div>
        </header>
