<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Industrial PRO</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Apache ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo-area">
                <span class="icon">📊</span>
                <h1>Intelligence Production</h1>
            </div>
            
            <div class="filters">
                <div class="input-group">
                    <label>De:</label>
                    <input type="date" id="dateStart">
                </div>
                <div class="input-group">
                    <label>Até:</label>
                    <input type="date" id="dateEnd">
                </div>
                <div class="input-group">
                    <label>Setor:</label>
                    <select id="filterSetor"><option value="todos">Todos os Setores</option></select>
                </div>
                <button id="btnFiltrar" class="primary-btn">Atualizar Dados</button>
            </div>
        </header>

        <main>
            <!-- KPIs -->
            <section class="kpi-grid">
                <div class="kpi-card producao">
                    <div class="kpi-icon">⚙️</div>
                    <div class="kpi-info">
                        <h3>Produção Total</h3>
                        <p id="totalProduzido">0</p>
                    </div>
                </div>
                <div class="kpi-card refugo">
                    <div class="kpi-icon">🗑️</div>
                    <div class="kpi-info">
                        <h3>Refugo Total</h3>
                        <p id="totalRefugo">0</p>
                    </div>
                </div>
                <div class="kpi-card performance">
                    <div class="kpi-icon">📈</div>
                    <div class="kpi-info">
                        <h3>Índice de Qualidade</h3>
                        <p id="percentualQualidade">0%</p>
                    </div>
                </div>
            </section>

            <!-- Gráficos -->
            <section class="charts-grid">
                <div class="chart-wrapper">
                    <div class="chart-header">
                        <h2 id="titleProd">Produção por Máquina</h2>
                        <button id="btnVoltarProd" class="back-btn" style="display:none">← Voltar</button>
                    </div>
                    <div id="chartProd" class="echart-container"></div>
                </div>
                <div class="chart-wrapper">
                    <div class="chart-header">
                        <h2 id="titleRef">Refugo por Setor</h2>
                        <button id="btnVoltarRef" class="back-btn" style="display:none">← Voltar</button>
                    </div>
                    <div id="chartRef" class="echart-container"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
